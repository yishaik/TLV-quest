name: Apply realtime refactor

on:
  push:
    branches: [feat/supabase-realtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-realtime
      - name: Apply refactor
        run: python scripts/patch_realtime_player.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/PremiumQuestPlayer.tsx components/QuestRealtimeProvider.tsx
          git commit -m "Connect player to shared realtime state"
          git push
