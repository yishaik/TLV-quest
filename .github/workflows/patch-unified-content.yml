name: Patch unified content studio

on:
  push:
    branches:
      - fix/unified-content-studio
    paths:
      - .automation/unified-content-patch.ready

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-content-studio
          fetch-depth: 0
      - name: Remove duplicate global MapLibre declaration
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/UnifiedContentStudio.tsx')
          source = path.read_text()
          source = source.replace('''declare global {\n  interface Window { maplibregl?: MapLibreNamespace }\n}\n\n''', '''const mapLibreWindow = () =>\n  window as unknown as { maplibregl?: MapLibreNamespace };\n\n''')
          source = source.replace('window.maplibregl', 'mapLibreWindow().maplibregl')
          path.write_text(source)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/UnifiedContentStudio.tsx
          git commit -m "fix: scope MapLibre browser type locally"
          git push origin HEAD:fix/unified-content-studio
