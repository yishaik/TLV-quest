name: Patch unified content studio

on:
  push:
    branches:
      - fix/unified-content-studio
    paths:
      - .automation/unified-content-patch.ready

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/unified-content-studio
          fetch-depth: 0
      - name: Narrow the existing CDN global safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('components/UnifiedContentStudio.tsx')
          source = path.read_text()
          old = '  if (mapLibreWindow().maplibregl) return Promise.resolve(mapLibreWindow().maplibregl);'
          new = '  const existingMapLibre = mapLibreWindow().maplibregl;\n  if (existingMapLibre) return Promise.resolve(existingMapLibre);'
          if old not in source:
              raise SystemExit('Expected MapLibre line was not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/UnifiedContentStudio.tsx
          git commit -m "fix: narrow MapLibre CDN global"
          git push origin HEAD:fix/unified-content-studio
