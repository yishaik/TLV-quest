name: Apply unified content studio

on:
  push:
    branches:
      - fix/unified-content-studio
    paths:
      - .automation/unified-content.tar.gz.b64

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/unified-content-studio
          fetch-depth: 0

      - name: Extract generated source
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .automation/unified-content.tar.gz.b64 > /tmp/unified-content.tar.gz
          echo "fb06a2416f417945decd721e1e5e96ac0faa21b4f6f7c2fda293249c197305df  /tmp/unified-content.tar.gz" | sha256sum --check -
          tar -xzf /tmp/unified-content.tar.gz

      - name: Commit generated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/UnifiedContentStudio.tsx components/UnifiedContentStudio.module.css app/admin/content/page.tsx app/admin/content/library/page.tsx
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "feat: unify content studio"
          git push origin HEAD:fix/unified-content-studio
