name: Apply realtime lint fix

on:
  push:
    branches: [feat/supabase-realtime]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/supabase-realtime
      - run: python scripts/fix_realtime_lint.py
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/QuestRealtimeProvider.tsx
          git commit -m "Defer initial realtime refresh"
          git push
