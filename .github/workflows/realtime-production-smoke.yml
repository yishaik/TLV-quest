name: Realtime production smoke

on:
  workflow_dispatch:
    inputs:
      run_code:
        description: Active production run reserved for the smoke test
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Test authenticated realtime flow
        shell: bash
        env:
          APP_URL: https://play.yishaik.com
          RUN_CODE: ${{ inputs.run_code }}
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          smoke_name="Realtime Smoke ${GITHUB_RUN_ID}"

          join_status=$(curl -sS -o "$work/join.json" -w '%{http_code}' \
            -X POST "$APP_URL/api/runs/$RUN_CODE/join" \
            -H 'content-type: application/json' \
            --data "$(jq -nc --arg name "$smoke_name" \
              '{firstName:$name,publicAlias:$name,language:"en",consent:true}')")
          test "$join_status" = "201"
          test "$(jq -r '.ok' "$work/join.json")" = "true"
          participant_id=$(jq -r '.data.participantId' "$work/join.json")
          participant_token=$(jq -r '.data.participantToken' "$work/join.json")

          state_status=$(curl -sS -o "$work/state.json" -w '%{http_code}' \
            "$APP_URL/api/participants/$participant_token/state")
          test "$state_status" = "200"
          test "$(jq -r '.ok' "$work/state.json")" = "true"
          run_id=$(jq -r '.data.run.id' "$work/state.json")
          team_id=$(jq -r '.data.team.id' "$work/state.json")

          auth_status=$(curl -sS -o "$work/auth.json" -w '%{http_code}' \
            -X POST "$APP_URL/api/participants/$participant_token/realtime-auth")
          test "$auth_status" = "200"
          test "$(jq -r '.ok' "$work/auth.json")" = "true"
          access_token=$(jq -r '.data.accessToken' "$work/auth.json")
          supabase_url=$(jq -r '.data.supabaseUrl // empty' "$work/auth.json")
          supabase_publishable_key=$(jq -r '.data.supabasePublishableKey // empty' "$work/auth.json")
          test -n "$access_token"
          test -n "$supabase_url"
          test -n "$supabase_publishable_key"
          test "$(jq -r '.data | has("refreshToken")' "$work/auth.json")" = "false"

          SUPABASE_URL="$supabase_url" \
            SUPABASE_PUBLISHABLE_KEY="$supabase_publishable_key" \
            node scripts/verify-supabase-public-access.mjs

          read_status=$(curl -sS -o "$work/events.json" -w '%{http_code}' \
            "$supabase_url/rest/v1/quest_realtime_events?select=id,run_id,team_id,source,operation&order=id.desc&limit=100" \
            -H "apikey: $supabase_publishable_key" \
            -H "authorization: Bearer $access_token")
          test "$read_status" = "200"
          jq -e --arg run "$run_id" --arg team "$team_id" \
            'all(.[]; .run_id == $run and (.team_id == null or .team_id == $team))' \
            "$work/events.json" >/dev/null

          device_id='22222222-2222-4222-8222-222222222222'
          now=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          expires=$(date -u -d '+60 seconds' +%Y-%m-%dT%H:%M:%SZ)
          presence_status=$(curl -sS -o "$work/presence.txt" -w '%{http_code}' \
            -X POST "$supabase_url/rest/v1/quest_presence?on_conflict=participant_id,device_id" \
            -H "apikey: $supabase_publishable_key" \
            -H "authorization: Bearer $access_token" \
            -H 'content-type: application/json' \
            -H 'prefer: resolution=merge-duplicates,return=minimal' \
            --data "{\"participant_id\":\"$participant_id\",\"device_id\":\"$device_id\",\"team_id\":\"$team_id\",\"run_id\":\"$run_id\",\"visible\":true,\"online_at\":\"$now\",\"expires_at\":\"$expires\"}")
          test "$presence_status" = "201" -o "$presence_status" = "204"

          foreign_status=$(curl -sS -o "$work/foreign.json" -w '%{http_code}' \
            -X POST "$supabase_url/rest/v1/quest_presence" \
            -H "apikey: $supabase_publishable_key" \
            -H "authorization: Bearer $access_token" \
            -H 'content-type: application/json' \
            -H 'prefer: return=minimal' \
            --data "{\"participant_id\":\"$participant_id\",\"device_id\":\"33333333-3333-4333-8333-333333333333\",\"team_id\":\"a51ded02-c928-472a-b8f2-f0946abbb5de\",\"run_id\":\"553ced60-3d47-4b43-bfc6-7c5609e2cd16\",\"visible\":true,\"online_at\":\"$now\",\"expires_at\":\"$expires\"}")
          test "$foreign_status" = "401" -o "$foreign_status" = "403"

          echo "participant_id=$participant_id"
          echo "run_id=$run_id"
          echo "team_id=$team_id"
          echo "join_http=$join_status"
          echo "state_http=$state_status"
          echo "auth_http=$auth_status"
          echo "event_read_http=$read_status"
          echo "presence_write_http=$presence_status"
          echo "foreign_presence_write_http=$foreign_status"
