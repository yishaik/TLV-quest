name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: https://your-project-ref.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      NEXT_PUBLIC_TWILIO_SANDBOX_NUMBER: "14155238886"
      NEXT_PUBLIC_TWILIO_SANDBOX_JOIN_CODE: test-code
      SUPABASE_SECRET_KEY: test-secret
      PII_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      TOKEN_PEPPER: ci-token-pepper
      ENABLE_EXTERNAL_MESSAGES: "false"
      TWILIO_VALIDATE_SIGNATURES: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reject hardcoded Supabase project hosts
        run: node scripts/assert-no-hardcoded-supabase.mjs

      - name: Install dependencies
        run: npm ci --no-audit --no-fund 2>&1 | tee install.log

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee lint.log

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          npm run test 2>&1 | tee test.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium 2>&1 | tee playwright-install.log

      - name: Browser tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e.log

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs-${{ github.run_id }}
          path: |
            install.log
            lint.log
            test.log
            build.log
            playwright-install.log
            e2e.log
          if-no-files-found: ignore
